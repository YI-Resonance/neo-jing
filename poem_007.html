        /* 註釋標籤 [1]：復原為紅色、粗體、縮小、上標，並移除底線 */
        .tooltip { position: relative; display: inline-block; color: #c0392b; cursor: help; font-size: 0.8em; vertical-align: super; margin-left: 2px; font-weight: bold; }
        
        /* 註釋方塊主體：保留 400px 寬度與 1.8 舒適行距 */
        .tooltip .tooltiptext { visibility: hidden; width: 400px; background-color: #fdf6e3; color: #333; text-align: left; border: 1px solid #ccc; border-radius: 6px; padding: 10px; position: absolute; z-index: 1; bottom: 125%; left: 50%; margin-left: -200px; opacity: 0; transition: opacity 0.3s; font-size: 1rem; font-weight: normal; line-height: 1.8; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        
        /* 註釋方塊：下方的倒三角形指標 */
        .tooltip .tooltiptext::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -6px; border-width: 6px; border-style: solid; border-color: #ccc transparent transparent transparent; }
        
        /* 註釋方塊：隱形橋樑 (讓滑鼠可以滑進方塊內複製文字) */
        .tooltip .tooltiptext::before {
            content: "";
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 20px; 
            background-color: transparent;
        }
        
        /* 滑鼠停留時顯示方塊 */
        .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }

    <h1>每代人</h1>
    
    <div class="poem-section">
        <img src="images/每代人-01.png" alt="[如果未顯示圖片，請確認 poem1.jpg 已放入同資料夾]" class="poem-image">
        <p>
            詩云睛自暗 <span class="tooltip">[1]<span class="tooltiptext">顧城詩《一代人》云：<br><br>「黑夜給了我黑色的眼睛，我卻用它尋找光明。」</span></span>，卻用眼尋明 <span class="tooltip">[1]<span class="tooltiptext">顧城詩《一代人》云：<br><br>「黑夜給了我黑色的眼睛，我卻用它尋找光明。」</span></span>。<br>

	    主曰光為愛 <span class="tooltip"><span class="tooltiptext"></span></span>，隨途履石平 <span class="tooltip">[2]<span class="tooltiptext">見〈若望一書：9 – 11〉</span></span>。<br>

	     
        </p>
	</div>
	<div class="poem-format">
	<p><br>體裁：五言絕句（平起首句不入韻）<br>韻部：平水韻．八庚<br>創作日期：二零二六年五月二日</p>
    </div>

    <div class="author-statement">
        <h3>作者自述：</h3>
        <p style="text-indent: 2em;">看〈若望一書：2:9-11〉時，突然想起顧城寫於文革後寫的《一代人》，遂寫了此詩，以感懷那個「眾人皆盲、兄弟相殘」的文革年代。這首詩屬隨筆性質，用了十分鐘完成初稿。</p>
        <p style="text-indent: 2em;"></p>
    </div>
